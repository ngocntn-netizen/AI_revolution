<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHN AI Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar 3 mục + một luồng tuyến tính 4 bước (Nộp file → Agent xử lý → Duyệt nháp → Hoàn tất) */
:root{
  --bg:#ffffff; --panel:#f7f8fa; --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --line2:#eef0f3;
  --orange:#FF5200; --orange-bg:#fff1ea; --blue:#185FA5; --blue-bg:#eaf2fb;
  --green:#15803d; --green-bg:#e9f7ee; --amber:#b45309; --amber-bg:#fff6e5; --red:#b91c1c; --red-bg:#fdecec;
  --ink:#1f2937; --ink-fg:#f9fafb;
  --sans:"Be Vietnam Pro","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#151821; --fg:#e5e7eb; --muted:#9ca3af; --line:#262b36; --line2:#1c2029;
  --orange:#ff6a26; --orange-bg:#3a1d0e; --blue:#6aa7e8; --blue-bg:#13263a;
  --green:#4ade80; --green-bg:#10281a; --amber:#fbbf24; --amber-bg:#2e230c; --red:#f87171; --red-bg:#351616;
  --ink:#e5e7eb; --ink-fg:#111827; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#151821; --fg:#e5e7eb; --muted:#9ca3af; --line:#262b36; --line2:#1c2029;
  --orange:#ff6a26; --orange-bg:#3a1d0e; --blue:#6aa7e8; --blue-bg:#13263a;
  --green:#4ade80; --green-bg:#10281a; --amber:#fbbf24; --amber-bg:#2e230c; --red:#f87171; --red-bg:#351616;
  --ink:#e5e7eb; --ink-fg:#111827; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:24px;height:24px;border-radius:6px;background:var(--orange);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:15px}.brand span{font-size:11px;color:var(--muted)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;white-space:nowrap;background:var(--panel);border:1px solid var(--line)}
.chip.ok{background:var(--green-bg);color:var(--green);border-color:transparent}
.chip.warn{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.chip.bad{background:var(--red-bg);color:var(--red);border-color:transparent}
.chip.info{background:var(--blue-bg);color:var(--blue);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{background:var(--panel)}
.btn.p{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.p:hover{filter:brightness(.95)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.main{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0}
.side{border-right:1px solid var(--line);background:var(--panel);padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.sbtn{border:0;background:none;border-radius:8px;padding:9px 12px;text-align:left;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.sbtn:hover{color:var(--fg);background:var(--bg)}
.sbtn.on{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.sbtn em{font-style:normal;font-family:var(--mono);font-size:11.5px}
.side-note{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
.content{overflow:auto;min-width:0}
.wrap{max-width:980px;margin:0 auto;padding:24px 24px 80px;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0}
.lead{color:var(--muted);margin:0;max-width:70ch}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--bg);display:flex;flex-direction:column;gap:12px}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stepper.s5{grid-template-columns:repeat(5,minmax(0,1fr))}.stepper.s5 div{cursor:pointer}
.stepper div{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);padding-top:8px;border-top:3px solid var(--line)}
.stepper div.on{color:var(--fg);font-weight:600;border-top-color:var(--orange)}
.stepper div.done{color:var(--fg);border-top-color:var(--green)}
.stepper span{font-family:var(--mono);font-size:12px}
.row{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;align-items:center}
select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--fg);font:inherit;width:100%}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.file .ic{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.file .ic.x{background:#1d7a46}.file .ic.p{background:#c0392b}
.file b{display:block;font-family:var(--mono);font-size:12.5px;word-break:break-all}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;display:block}
.drop:hover{border-color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:2px}
.st{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.st:last-child{border-bottom:0}
.st .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.st.done .ic{background:var(--green-bg);color:var(--green);border-color:transparent}
.st.run .ic{background:var(--blue-bg);color:var(--blue);border-color:transparent;animation:pulse 1s infinite}
.st.wait{opacity:.45}
.st b{font-weight:600}
.st .res{font-size:13px;color:var(--muted)}
@keyframes pulse{50%{opacity:.4}}
.sys{border:2px solid var(--blue);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.sys .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--panel);text-align:left;font-weight:600;color:var(--muted);font-size:12px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.bad td{background:var(--red-bg)}
tr.warn td{background:var(--amber-bg)}
tr.del td{opacity:.45;text-decoration:line-through}
tr.chg td{background:var(--blue-bg)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-family:var(--mono);font-weight:600}
.stat span{font-size:12.5px;color:var(--muted)}
.q{border:1.5px solid var(--amber);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.q.done{border-color:var(--line);background:var(--panel)}
.q .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.trace{font-size:13px;color:var(--green);font-weight:500}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.confirm{border:1.5px solid var(--orange);background:var(--orange-bg);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.big-ok{width:44px;height:44px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.note{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;border-radius:12px;padding:10px 14px}
.msg.u{align-self:flex-end;background:var(--blue-bg)}
.msg.a{align-self:flex-start;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px;max-width:100%;width:100%}
.who{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.composer{display:flex;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px}
.composer input{flex:1;border:0;background:none;color:var(--fg);font:inherit;padding:4px 6px;min-width:0}
.composer input:focus{outline:none}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.newp{color:var(--green);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.45);display:grid;place-items:center;padding:16px;z-index:30}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:12px;max-width:820px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40}
.toastbox{background:var(--ink);color:var(--ink-fg);border-radius:8px;padding:10px 14px;font-size:13px;max-width:360px}
.link{color:var(--blue);background:none;border:0;padding:0;cursor:pointer;font:inherit}
.link:hover{text-decoration:underline}
.crumb{font-size:13px;color:var(--muted)}
.wfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wfcard{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:170px}
.rc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:2px 8px 2px 2px;font-family:var(--mono);font-size:11.5px;background:var(--bg);cursor:pointer;color:var(--fg)}
.rc i{font-style:normal;font-family:var(--sans);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:4px}
.rc.w{border-color:var(--red)}
.t-skill i{background:var(--orange-bg);color:var(--orange)}
.t-tool i{background:var(--blue-bg);color:var(--blue)}
.t-know i{background:var(--green-bg);color:var(--green)}
.t-pol i{background:var(--red-bg);color:var(--red)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 10px;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--fg);color:var(--fg)}
.tabs .rc{border:0;padding:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel)}
@media (max-width:860px){.wfgrid{grid-template-columns:1fr}}
.wsbox{position:relative;margin-bottom:8px}
.wsbtn{width:100%;display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;text-align:left}
.wsbtn b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wsbtn small{color:var(--muted);font-size:11.5px}
.wsbtn>span:nth-child(2){flex:1}
.wsav{width:26px;height:26px;border-radius:7px;background:var(--orange);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.wsmenu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:10;display:flex;flex-direction:column;gap:2px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.wsmenu button{border:0;background:none;text-align:left;border-radius:6px;padding:6px 8px;display:flex;gap:8px;align-items:center;font-size:13px}
.wsmenu button:hover,.wsmenu button.on{background:var(--panel)}
.sgroup{margin:14px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);font-weight:700}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs2 button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs2 button.on{color:var(--fg);border-bottom-color:var(--fg)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.io div{background:var(--panel);border-radius:8px;padding:8px 10px;font-size:12.5px}
.io i,.pcol i{display:block;font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:2px}
.pipe{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1.3fr) 28px minmax(0,1fr);align-items:stretch}
.pcol{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pcol.proc{border:2px solid var(--fg)}
.parr{display:grid;place-items:center;color:var(--muted);font-size:18px}
.pstep{display:flex;gap:8px;align-items:center;font-size:13px}
.pstep span{width:20px;height:20px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;flex:none}
.chk{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;font-size:13px;flex-wrap:wrap}
.chk>span:first-child{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--green-bg);color:var(--green)}
.chk.bad>span:first-child{background:var(--red-bg);color:var(--red)}
.chk.bad{border-color:var(--red)}
.bot{display:flex;gap:10px;align-items:flex-start;background:var(--blue-bg);border-radius:10px;padding:10px 14px;font-size:13.5px}
.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--fg);font:inherit;width:100%}
textarea.inp{font-family:var(--mono);font-size:12.5px}
.pick{display:inline-flex;gap:4px;align-items:center}
.tog{width:36px;height:20px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0}
.tog span{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--green)}.tog.on span{left:18px}
.tog:disabled{opacity:.6;cursor:not-allowed}
@media (max-width:860px){.pipe{grid-template-columns:1fr}.parr{transform:rotate(90deg)}.io{grid-template-columns:1fr}.stepper.s5 div{font-size:10.5px}}
.sbtn.new{border:1px solid var(--line);background:var(--bg);color:var(--fg);font-weight:600;margin-bottom:6px}
.chatpage{display:grid;grid-template-columns:minmax(340px,430px) minmax(0,1fr);height:100%;min-height:0}
.ccol{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.cscroll{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.ccomp{padding:10px 14px 14px;border-top:1px solid var(--line)}
.cm{display:flex;gap:10px;align-items:flex-start}
.cm.u{justify-content:flex-end}
.cm.u .cb{background:var(--blue-bg);border-radius:12px;padding:9px 12px;max-width:90%;display:flex;flex-direction:column;gap:6px}
.cm.a .cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.av{width:26px;height:26px;border-radius:7px;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.fch{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.fi{width:26px;height:20px;border-radius:4px;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;font-family:var(--sans)}
.fi.x{background:#1d7a46}.fi.p{background:#c0392b}
.sugg2{display:flex;flex-direction:column;gap:6px;margin-left:36px}
.sugg2 button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.sugg2 button:hover{border-color:var(--orange)}
.sugg2 span{font-size:12px;color:var(--muted)}
.cscroll .steps .st{padding:6px 0}
.cscroll .q{padding:10px 12px}
.ocol{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.otabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.otabs button{border:1px solid transparent;border-bottom:0;background:none;border-radius:8px 8px 0 0;padding:7px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.otabs button.on{background:var(--bg);border-color:var(--line);color:var(--fg);font-weight:600;margin-bottom:-1px}
.obody{flex:1;overflow:auto;background:var(--bg);padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.oempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px}
.oico{width:48px;height:48px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:20px}
@media (max-width:860px){.chatpage{grid-template-columns:1fr;height:auto}.ccol{border-right:0;border-bottom:1px solid var(--line)}.cscroll{max-height:none}.ocol{min-height:420px}}
.sdiv{height:1px;background:var(--line);margin:10px 12px}
.composer2{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.composer2 input#ask{border:0;background:none;color:var(--fg);font:inherit;padding:4px 2px;min-width:0}
.composer2 input#ask:focus{outline:none}
.composer2:focus-within{border-color:var(--muted)}
.ctools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--fg)}
.tbtn:hover,.tbtn.on{border-color:var(--fg)}
.selchip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border-radius:8px;padding:3px 6px 3px 3px;font-size:12.5px;border:1px solid var(--line);background:var(--bg)}
.selchip i{font-style:normal;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:4px}
.selchip.wf i{background:var(--blue-bg);color:var(--blue)}.selchip.sk i{background:var(--orange-bg);color:var(--orange)}
.selchip button{border:0;background:none;color:var(--muted);padding:0 2px}
.ccomp{position:relative}
.pop{position:absolute;left:14px;right:14px;bottom:calc(100% - 4px);background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;max-height:340px;overflow:auto;z-index:15;display:flex;flex-direction:column;gap:2px}
.poph{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 8px}
.pop button{border:0;background:none;text-align:left;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.pop button:hover{background:var(--panel)}
.pop button span{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#gate{min-height:100%;background:var(--panel)}
.gwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gcard{width:100%;max-width:420px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:28px 28px 24px;display:flex;flex-direction:column;gap:14px}
.gcard.wide{max-width:600px}
.glogo{display:flex;gap:12px;align-items:center}
.sso{display:flex;gap:10px;align-items:center;justify-content:center;padding:11px 14px;font-weight:600}
.gsq{width:20px;height:20px;border-radius:5px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.gor{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.gor::before,.gor::after{content:"";flex:1;height:1px;background:var(--line)}
.demo-acc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.demo-acc>div{flex:1;min-width:0}
.eyebrow2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--orange);font-weight:700}
.wsrow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.wsrow.on{border-color:var(--green);background:var(--green-bg)}
.wsrow.mine{background:var(--panel)}
.wsrow .wsav{width:34px;height:34px;font-size:15px;border-radius:9px}
@media (max-width:860px){
  .app{height:auto}.main{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .sbtn{white-space:nowrap}.side-note{display:none}
  .wrap{padding:18px 16px 60px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row,.kv{grid-template-columns:1fr}
  .stepper div{font-size:11.5px}
  .top .hide-sm{display:none}
}

<style>[hidden]{display:none!important}</style></head><body>

<div class="app">
  <header class="top">
    <div class="logo">G</div>
    <div class="brand"><b>GHN AI Platform</b><span>AI Experimentation OS</span></div>
    <span class="chip warn hide-sm">Staging B2B · dữ liệu mô phỏng</span>
    <div class="spacer"></div>
    <button class="btn sm" data-act="logout" title="Đăng xuất">Đăng xuất</button>
    <button class="btn sm" id="rolechip" data-act="role" title="Đổi vai trò để xem màn Super admin">Ngọc · Member</button>
  </header>
  <div class="main">
    <nav class="side" id="side" aria-label="Menu"></nav>
    <section class="content" id="content"></section>
  </div>
</div>
<div id="gate" hidden></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const S={page:'home',wf:'cai_gia_ltl',lt:'Skill',step:1,prog:0,a:{},confirm:false,created:false,
 chat:0,c02:null,uconfirm:false,scheduled:false,files:['Bang_gia_ConCung_2026.xlsx','Hop_dong_ConCung_LTL_2026.pdf']};

const REQS=[
 ['Đơn vị tính','CBM hoặc KG, một bảng một đơn vị'],
 ['Cơ chế tối thiểu','Không dùng · MOQ · Min charge; chung cả bảng hoặc theo tuyến'],
 ['Bậc sản lượng','Liền mạch, không hở, không chồng; mỗi bậc một đơn giá'],
 ['Địa chỉ','Địa giới cũ (có Quận/Huyện) hoặc mới'],
 ['File tuyến','Điểm lấy → điểm giao, 4 cấp, tối đa 5.000 dòng'],
 ['Kiểm tra','2 dòng cùng cấp khớp 1 địa chỉ là lỗi chặn'],
 ['Vòng đời','Draft → Scheduled → Active; sửa = tạo bản nháp mới']
];
const STEPS=[
 ['Đọc bảng giá của khách','Tab "Bảng giá LTL", tiêu đề ở dòng 4, 130 tuyến',[['Tool','pricing_tools.read_price_file'],['Knowledge','profile_ConCung']]],
 ['Đọc hợp đồng','Đơn vị CBM (điều 4.1) · tối thiểu 0,5 CBM (điều 4.3) · hiệu lực 01/10/2026 (điều 9)',[['Skill','doc_hop_dong_van_chuyen']]],
 ['Hỏi hệ thống B2B: cài giá LTL cần những gì?','Hệ thống trả về 7 yêu cầu. Nháp sẽ sinh đúng theo khung này',[['Tool','b2b_pricing.get_pricing_requirements']]],
 ['Nhận diện cấu trúc bảng giá','1 bậc, đơn giá theo CBM, MOQ theo tuyến · độ tin cậy 0,96',[['Knowledge','archetype_ltl']]],
 ['Chuẩn hóa tuyến theo master data','129/130 tuyến khớp',[['Tool','master_data.lookup_lane'],['Knowledge','master_data_lanes']]],
 ['Kiểm tra theo rule cài giá','127 hợp lệ · 2 cần bạn quyết · 1 giữ lại',[['Knowledge','ruleset_cai_gia'],['Policy','chung']]]
];
const TC={Skill:'t-skill',Tool:'t-tool',Knowledge:'t-know',Policy:'t-pol'};
const TLB={Skill:'Skill',Tool:'MCP',Knowledge:'KB',Policy:'Policy'};
function rc(r){const nm=r[1].split('.')[0];const w=nm==='b2b_pricing'&&(r[1].includes('create')||r[1].includes('schedule')||r[1]==='b2b_pricing');return `<button class="rc ${TC[r[0]]} ${w?'w':''}" data-res="${nm}"><i>${TLB[r[0]]}</i>${r[1]}</button>`}
const LANES=[
 ['Hưng Yên','Q.1, TP.HCM','Quận/Huyện','0,5','285.000',''],
 ['Hưng Yên','Q.3, TP.HCM','Quận/Huyện','0,5','285.000',''],
 ['Hưng Yên','TP. Thủ Đức','Quận/Huyện','1','265.000','P03'],
 ['Hưng Yên','Q.9, TP.HCM (cũ)','Quận/Huyện','1','265.000','P03'],
 ['Hưng Yên','Đà Nẵng','Tỉnh/TP','0,5','190.000',''],
 ['Hưng Yên','Huế','Tỉnh/TP','0,5','190.000',''],
 ['Hưng Yên','Cần Thơ','Tỉnh/TP','0,5','310.000',''],
 ['Hưng Yên','Bà Rịa - Vũng Tàu','Tỉnh/TP','0,5','295.000','M01'],
 ['Hưng Yên','Hà Nội (nội thành)','Vùng','1','95.000','']
];
function toast(m){$('#toast').innerHTML=`<div class="toastbox">✓ ${m}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').innerHTML='',2600)}

function stepper(){const L=['Nộp file','Agent xử lý','Duyệt nháp','Hoàn tất'];return `<div class="stepper">${L.map((l,i)=>`<div class="${S.step===i+1?'on':S.step>i+1?'done':''}"><span>${S.step>i+1?'✓':i+1}</span>${l}</div>`).join('')}</div>`}
function reqTable(){return `<div class="tw"><table><tbody>${REQS.map(r=>`<tr><td style="width:170px"><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>`}

/* ---------- Bước 1 ---------- */
function s1(){return `<div><h1>Cài bảng giá LTL cho khách mới</h1><p class="lead">Nộp bảng giá và hợp đồng của khách. Agent đọc, hỏi hệ thống B2B cần gì, rồi tạo bản nháp để bạn duyệt. Làm tay mất khoảng 1,5 ngày.</p></div>
 <div class="card">
  <div class="row"><label for="cus">Khách hàng</label><select id="cus"><option>Con Cưng · mã KH 42495 · chưa có bảng giá LTL</option></select></div>
  <div class="row"><label for="svc">Dịch vụ</label><select id="svc"><option>LTL (hàng lẻ)</option></select></div>
  <div class="row" style="align-items:start"><span>File của khách</span><div style="display:flex;flex-direction:column;gap:8px">
   ${S.files.map(f=>`<div class="file"><span class="ic ${f.endsWith('.pdf')?'p':'x'}">${f.endsWith('.pdf')?'PDF':'XLS'}</span><div style="min-width:0"><b>${f}</b><span class="muted" style="font-size:12px">${f.startsWith('Bang_gia_ConCung')?'Bảng giá · 2 tab · 130 dòng':f.startsWith('Hop_dong')?'Hợp đồng · 14 trang':'Tải lên'}</span></div></div>`).join('')}
   <label class="drop" for="upl">+ Thêm file (Excel, PDF)</label><input type="file" id="upl" hidden></div></div>
 </div>
 <div class="btns"><button class="btn p" data-act="start">Bắt đầu</button><span class="muted" style="font-size:13px">File mẫu đã được che thông tin khách</span></div>`}

/* ---------- Bước 2 ---------- */
function s2(){
 const done=S.prog>=STEPS.length;
 return `<div><h1>Agent đang xử lý</h1><p class="lead">Con Cưng · 42495 · LTL · 2 file</p></div>
 <div class="card"><div class="steps">${STEPS.map((s,i)=>{const st=i<S.prog?'done':i===S.prog?'run':'wait';
  return `<div class="st ${st}"><span class="ic">${st==='done'?'✓':i+1}</span><div style="display:flex;flex-direction:column;gap:4px"><b>${s[0]}</b>${st==='done'?`<div class="res">${s[1]}</div>`:st==='run'?'<div class="res">đang làm…</div>':''}<div class="btns" style="gap:5px">${s[2].map(rc).join('')}</div></div></div>`}).join('')}</div></div>
 ${S.prog>=3?`<div class="sys"><div class="h"><span class="chip info">Hệ thống B2B trả lời</span><b>Yêu cầu để cài bảng giá LTL</b></div>${reqTable()}<div class="note">Agent hỏi thẳng hệ thống thay vì đoán. Hệ thống đổi yêu cầu thì agent đọc lại, không phải sửa prompt.</div></div>`:''}
 <div class="btns"><button class="btn p" data-act="toReview" ${done?'':'disabled'}>Xem bản nháp</button></div>`;
}
function tick(){if(S.page!=='run'||S.step!==2)return;if(S.prog<STEPS.length){S.prog++;render();setTimeout(tick,S.prog===3?1100:650)}}

/* ---------- Bước 3 ---------- */
function laneRows(){return LANES.map((l,i)=>{let cls='',chk='<span class="chip ok">hợp lệ</span>';
 if(l[5]==='P03'){if(S.a.p03==='drop'&&i===3){cls='del';chk='<span class="chip">đã bỏ</span>'}else if(S.a.p03){chk='<span class="chip ok">đã xử lý</span>'}else{cls='bad';chk='<span class="chip bad">trùng địa chỉ</span>'}}
 if(l[5]==='M01'){cls='warn';chk='<span class="chip warn">chưa có trong master data</span>'}
 return `<tr class="${cls}"><td class="num">${i+1}</td><td>${l[0]}</td><td>${l[1]}</td><td class="r num">${l[3]}</td><td class="r num">${l[4]}</td><td>${chk}</td></tr>`}).join('')+`<tr><td colspan="6" class="muted">… 121 tuyến khác, tất cả hợp lệ</td></tr>`}
function s3(){
 const ok=S.a.c01&&S.a.p03;const n=S.a.p03==='drop'?129:130;
 return `<div><h1>Duyệt bản nháp bảng giá</h1><p class="lead">Nháp sinh đúng 7 yêu cầu của hệ thống B2B. Còn 2 chỗ agent không tự quyết.</p></div>
 <div class="stats"><div class="stat"><b>130</b><span>tuyến đọc được</span></div><div class="stat"><b style="color:var(--green)">127</b><span>hợp lệ</span></div><div class="stat"><b style="color:${ok?'var(--green)':'var(--amber)'}">${ok?0:2-(S.a.c01?1:0)-(S.a.p03?1:0)}</b><span>cần bạn quyết</span></div><div class="stat"><b style="color:var(--amber)">1</b><span>giữ lại, chờ Ops</span></div></div>
 <div class="q ${S.a.c01?'done':''}"><div class="h"><span class="chip warn">1</span>Hợp đồng và file khác nhau về mức tối thiểu</div>
  <div>Hợp đồng ghi tối thiểu <b>0,5 CBM chung</b>. File ghi MOQ theo từng tuyến, có 3 tuyến là <b>1 CBM</b> (Thủ Đức, Q.9 cũ, Hà Nội nội thành). Theo bên nào?</div>
  ${S.a.c01?`<div class="trace">✓ Bạn chọn: ${S.a.c01==='file'?'theo file, MOQ theo tuyến':'theo hợp đồng, 0,5 CBM chung'} · 09:44</div>`:'<div class="btns"><button class="btn p sm" data-ans="c01:file">Theo file, MOQ theo tuyến</button><button class="btn sm" data-ans="c01:hd">Theo hợp đồng, 0,5 CBM chung</button></div>'}</div>
 <div class="q ${S.a.p03?'done':''}"><div class="h"><span class="chip warn">2</span>Hai tuyến trùng một địa chỉ</div>
  <div><b>TP. Thủ Đức</b> và <b>Q.9 (cũ)</b> cùng khớp địa chỉ Q.9 cũ. Hệ thống B2B sẽ chặn khi import.</div>
  ${S.a.p03?`<div class="trace">✓ Bạn chọn: ${S.a.p03==='drop'?'bỏ dòng Q.9 cũ, giữ Thủ Đức':'giữ cả 2, hỏi lại khách'} · 09:44</div>`:'<div class="btns"><button class="btn p sm" data-ans="p03:drop">Bỏ Q.9 cũ, giữ Thủ Đức</button><button class="btn sm" data-ans="p03:keep">Giữ cả 2, hỏi lại khách</button></div>'}</div>
 <div class="card"><h2>Cấu hình bảng giá</h2><dl class="kv">
  <dt>Đơn vị</dt><dd>CBM <span class="muted">· hợp đồng điều 4.1</span></dd>
  <dt>Tối thiểu</dt><dd>${S.a.c01==='hd'?'0,5 CBM chung cả bảng':'MOQ theo tuyến'} ${S.a.c01?'':'<span class="chip warn">chờ bạn quyết</span>'}</dd>
  <dt>Bậc</dt><dd>1 bậc, đơn giá theo CBM</dd>
  <dt>Địa chỉ</dt><dd>Địa giới cũ</dd>
  <dt>Hiệu lực</dt><dd>01/10/2026 <span class="muted">· hợp đồng điều 9</span></dd></dl>
